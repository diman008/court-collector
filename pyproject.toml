[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "judicial-intelligence"
version = "2.1.0a1"
description = "Evidence-first analysis of Russian arbitration court documents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "pypdf>=5,<7", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
judicial-intelligence = "judicial_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["judicial_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
